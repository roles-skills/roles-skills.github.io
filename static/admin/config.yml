    - name: job_evaluation
      label: Job evaluation
      widget: object
      hint: Score every factor. The total must fall within the band's points range.
      fields:
      - name: communication
        label: Communication and relationship skills
        widget: select
        options:
        - label: '1: Gives and receives routine information orally, mainly with colleagues.'
          value: 1
        - label: '2: Gives and receives routine information orally, in writing, or electronically, with colleagues and others.'
          value: 2
        - label: '3: Gives routine information needing tact or persuasion, or complex or sensitive information, or straightforward training to groups.'
          value: 3
        - label: '4: Gives complex, sensitive, or contentious information needing persuasion, negotiation, or training skills, or highly complex information.'
          value: 4
        - label: '5: Gives highly complex or contentious information needing developed persuasion and negotiation, presents to large groups, or communicates where there are significant barriers to acceptance.'
          value: 5
        - label: '6: Gives highly complex, highly contentious information where there are significant barriers to acceptance, using the highest level of communication skills.'
          value: 6
      - name: knowledge
        label: Knowledge, training, and experience
        widget: select
        options:
        - label: '1: A few routine procedures, learned on the job in a short induction.'
          value: 1
        - label: '2: A range of routine procedures, learned through on-the-job training and induction.'
          value: 2
        - label: '3: A range of procedures, some non-routine, needing base-level theory (for example a level 3 qualification or equivalent experience).'
          value: 3
        - label: '4: A range of procedures, mostly non-routine, needing intermediate theory (for example a foundation degree or equivalent experience).'
          value: 4
        - label: '5: Expertise in a specialism, underpinned by theory or practical experience (degree level or equivalent).'
          value: 5
        - label: '6: Specialist knowledge across the range of the specialism (postgraduate diploma level or equivalent).'
          value: 6
        - label: '7: Highly developed specialist knowledge across the range of the specialism (master''s level or equivalent).'
          value: 7
        - label: '8: Advanced knowledge (doctorate plus further training or equivalent), or specialist knowledge across more than one discipline built over a long period.'
          value: 8
      - name: analytical
        label: Analytical and judgemental skills
        widget: select
        options:
        - label: '1: Judgements on straightforward facts or situations.'
          value: 1
        - label: '2: Judgements on facts or situations, some needing analysis.'
          value: 2
        - label: '3: Judgements on a range of facts or situations needing analysis or comparison of options.'
          value: 3
        - label: '4: Judgements on complex facts or situations needing analysis, interpretation, and comparison of options.'
          value: 4
        - label: '5: Judgements on highly complex facts or situations needing analysis, interpretation, and comparison of options.'
          value: 5
      - name: planning
        label: Planning and organisational skills
        widget: select
        options:
        - label: '1: Organises own day-to-day work.'
          value: 1
        - label: '2: Plans straightforward tasks or activities, some ongoing.'
          value: 2
        - label: '3: Plans several complex activities, adjusting plans as needed.'
          value: 3
        - label: '4: Plans a broad range of complex activities or strategies, adjusting them as needed.'
          value: 4
        - label: '5: Forms long-term strategic plans, with uncertainty and effects across the organisation.'
          value: 5
      - name: physical-skills
        label: Physical skills
        widget: select
        options:
        - label: '1: Little need for physical skills.'
          value: 1
        - label: '2: Skills gained through practice, such as standard keyboard use or driving.'
          value: 2
        - label: '3: Developed skills needing speed or accuracy, such as advanced keyboard use.'
          value: 3
        - label: '4: Highly developed skills needing precision or speed and high hand–eye coordination.'
          value: 4
        - label: '5: The highest level of precision, speed, and coordination.'
          value: 5
      - name: patient-care
        label: Responsibility for patient and client care
        widget: select
        options:
        - label: '1: Helps patients, clients, or relatives during incidental contact.'
          value: 1
        - label: '2: Gives general non-clinical advice, information, or services directly to patients or the public.'
          value: 2
        - label: '3: Gives personal care, basic clinical technical services, or basic clinical advice.'
          value: 3
        - label: '4: Carries out clinical care, provides clinical technical services, or advises on the care of patients.'
          value: 4
        - label: '5: Develops programmes of care, provides specialist clinical technical services, or gives specialised advice on patient care.'
          value: 5
        - label: '6: Develops specialised care, gives highly specialised advice, or is accountable for part of a clinical service.'
          value: 6
        - label: '7: Accountable for delivering a clinical or care service.'
          value: 7
        - label: '8: Corporate responsibility for clinical or care services.'
          value: 8
      - name: policy
        label: Responsibility for policy and service development
        widget: select
        options:
        - label: '1: Follows policies set by others; may comment on changes.'
          value: 1
        - label: '2: Implements policies for own area and proposes changes to its practices.'
          value: 2
        - label: '3: Implements policies for own area and proposes changes that affect other areas.'
          value: 3
        - label: '4: Implements policy and develops policy or services for a service or several areas.'
          value: 4
        - label: '5: Implements and develops a range of policies or services for a directorate.'
          value: 5
        - label: '6: Corporate responsibility for major policy or service development across or beyond the organisation.'
          value: 6
      - name: financial-resources
        label: Responsibility for financial and physical resources
        widget: select
        options:
        - label: '1: Takes personal care of equipment and resources used in own work.'
          value: 1
        - label: '2: Handles cash or valuables, looks after equipment used by others, controls stock, or authorises small payments.'
          value: 2
        - label: '3: Authorises payments, buys some assets or supplies, monitors or holds a delegated budget, or maintains assets.'
          value: 3
        - label: '4: Holds or sets the budget for a department or service, or buys or maintains its assets.'
          value: 4
        - label: '5: Holds or sets budgets, or manages assets, for several services.'
          value: 5
        - label: '6: Corporate responsibility for the organisation''s finances or assets.'
          value: 6
      - name: people
        label: Responsibility for people
        widget: select
        options:
        - label: '1: Shows own work routines to new or less experienced colleagues.'
          value: 1
        - label: '2: Supervises or coordinates staff day to day, trains others regularly, or gives basic HR advice.'
          value: 2
        - label: '3: Manages a group of staff day to day, teaches core or specialist training, or gives core HR advice.'
          value: 3
        - label: '4: Line manages a function or department, designs training programmes as a main duty, or delivers a full range of HR services.'
          value: 4
        - label: '5: Line manages several departments, or manages training or a large part of HR across the organisation.'
          value: 5
        - label: '6: Corporate responsibility for the organisation''s people or HR function.'
          value: 6
      - name: information-resources
        label: Responsibility for information resources
        widget: select
        options:
        - label: '1: Records information that the job holder produces.'
          value: 1
        - label: '2: Enters or stores data compiled by others, or occasionally writes reports or queries.'
          value: 2
        - label: '3: Takes formal minutes, regularly writes reports or queries, or maintains information systems as a significant duty.'
          value: 3
        - label: '4: Adapts or designs information systems to others'' specifications, or runs information systems for a department as the main duty.'
          value: 4
        - label: '5: Designs and develops major information systems, or runs information systems for several services as the main duty.'
          value: 5
        - label: '6: Manages and develops information systems across the organisation as the main duty.'
          value: 6
        - label: '7: Corporate responsibility for the organisation''s information systems.'
          value: 7
      - name: research
        label: Responsibility for research and development
        widget: select
        options:
        - label: '1: Carries out surveys or audits for own work; occasionally takes part in research or testing.'
          value: 1
        - label: '2: Regularly does research, development, trials, or equipment and system testing as part of the job.'
          value: 2
        - label: '3: Carries out research or development within formal programmes as a main duty.'
          value: 3
        - label: '4: Coordinates and carries out research and development programmes.'
          value: 4
        - label: '5: Initiates and develops research and development programmes that support the organisation''s objectives.'
          value: 5
        - label: '6: Initiates and develops research and development programmes with effects beyond the organisation.'
          value: 6
      - name: freedom-to-act
        label: Freedom to act
        widget: select
        options:
        - label: '1: Works within set procedures, with supervision close by.'
          value: 1
        - label: '2: Follows standard procedures and precedent; someone is usually available to ask; work may be checked.'
          value: 2
        - label: '3: Follows defined policies and procedures; work is managed rather than supervised.'
          value: 3
        - label: '4: Results are defined, but the job holder decides how to achieve them, within broad policy.'
          value: 4
        - label: '5: Works within general policies, and in most cases decides how to interpret them.'
          value: 5
        - label: '6: Interprets overall policy and strategy to set goals and standards.'
          value: 6
      - name: physical-effort
        label: Physical effort
        widget: select
        options:
        - label: '1: Sitting, standing, and walking, with little physical effort.'
          value: 1
        - label: '2: Frequent sitting or standing in a restricted position, or occasional light to moderate effort.'
          value: 2
        - label: '3: Frequent light effort for long periods, or frequent moderate effort for short periods.'
          value: 3
        - label: '4: Ongoing light effort, frequent moderate effort for long periods, or occasional intense effort.'
          value: 4
        - label: '5: Ongoing moderate effort, or frequent intense effort.'
          value: 5
      - name: mental-effort
        label: Mental effort
        widget: select
        options:
        - label: '1: General attention; occasional concentration on predictable work.'
          value: 1
        - label: '2: Frequent concentration on predictable work, or occasional concentration on unpredictable work.'
          value: 2
        - label: '3: Frequent concentration on unpredictable work, or occasional prolonged concentration.'
          value: 3
        - label: '4: Frequent prolonged concentration, or occasional intense concentration.'
          value: 4
        - label: '5: Frequent intense concentration.'
          value: 5
      - name: emotional-effort
        label: Emotional effort
        widget: select
        options:
        - label: '1: Rare exposure, or occasional indirect exposure, to distressing circumstances.'
          value: 1
        - label: '2: Occasional exposure, or frequent indirect exposure, to distressing circumstances.'
          value: 2
        - label: '3: Frequent exposure to distressing circumstances, or occasional exposure to highly distressing ones.'
          value: 3
        - label: '4: Occasional exposure to traumatic circumstances, or frequent exposure to highly distressing ones.'
          value: 4
      - name: working-conditions
        label: Working conditions
        widget: select
        options:
        - label: '1: Rare exposure to unpleasant conditions.'
          value: 1
        - label: '2: Occasional unpleasant conditions, frequent travel or outdoor work, or near-continuous screen use on most days.'
          value: 2
        - label: '3: Frequent unpleasant conditions, or occasional highly unpleasant ones.'
          value: 3
        - label: '4: Some exposure to hazards, or frequent highly unpleasant conditions.'
          value: 4
        - label: '5: Considerable exposure to hazards.'
          value: 5
