# GENERATED by scripts/cms_config.py from data/ in the monorepo; do not edit.
# Sveltia CMS at /admin/ edits data/ in the monorepo through the GitHub backend.
# After an edit, run python3 scripts/build.py, then roles-skills.github.io/bin/sync.
